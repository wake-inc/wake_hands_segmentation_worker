[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wake_hands_segmentation_worker"
version = "0.1.0"
description = "Contact-aware egocentric hand-object segmentation"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Yuejiao Su" }, { name = "Yi Wang" }, { name = "Lap-Pui Chau" }]
dependencies = [
  "einops==0.8.1",
  "mmcv-lite==2.0.0",
  "mmengine==0.7.3",
  "mmsegmentation==1.0.0",
  "numpy>=1.24,<2",
  "opencv-python==4.11.0.86",
  "pillow>=9.4",
  "prettytable>=3.7",
  "requests>=2.32,<3",
  "scipy>=1.10,<2",
  "segmentation-refinement==0.6",
  "shapely==2.1.2",
  "timm==0.4.5",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "typing-extensions>=4.6",
  "wake-job-queue[http] @ git+https://github.com/wake-inc/wake_app.git@83690cc11270ee60bd8d8474508abb278c5d268d#subdirectory=packages/job-queue-py",
  "wake-storage @ git+https://github.com/wake-inc/wake_app.git@83690cc11270ee60bd8d8474508abb278c5d268d#subdirectory=packages/storage-py",
]

[project.urls]
Homepage = "https://yuggiehk.github.io/CaRe-Ego/"
Repository = "https://github.com/yuggiehk/CaRe-Ego"
Paper = "https://arxiv.org/abs/2407.05576"

[tool.hatch.build.targets.wheel]
packages = ["care_ego"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "care_ego/config.py",
  "care_ego/datasets",
  "care_ego/metrics.py",
  "care_ego/models",
]
